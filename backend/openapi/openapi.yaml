openapi: 3.1.0
info:
  title: Habit Home API
  version: 0.1.0
  description: |
    Initial HTTP contract for Habit Home. Timestamps are UTC RFC 3339 strings.
    Calendar dates are interpreted in the household IANA timezone. Authentication
    uses an HTTP-only session cookie; state-changing requests also require the
    CSRF header. Child sessions are restricted to the selected child.
servers:
  - url: /
security:
  - sessionCookie: []
tags:
  - { name: Authentication }
  - { name: Household }
  - { name: Children }
  - { name: Habits }
  - { name: Assignments }
  - { name: Tasks }
  - { name: Today }
  - { name: Completions }
  - { name: Review }
  - { name: Points }
  - { name: Reports }
  - { name: Operations }

paths:
  /api/v1/parent/overview:
    get:
      tags: [Reports]
      summary: Get household-local parent overview aggregates
      description: Returns every active child with today's completed, assigned total, and pending-review counts. Occurrences are lazily materialized for the household-local date.
      responses:
        '200':
          description: Parent overview
          content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/ParentOverview' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register the owner and household
      description: |
        Completes the client-visible account and household onboarding steps in one
        database transaction. The user, household, owner membership, and initial
        Parent Mode session either all commit or none commit. A successful request
        enters Parent Mode immediately. Duplicate normalized email addresses return
        the same conflict shape without exposing other account details.
      security: []
      x-rate-limit-policy: registration-source
      requestBody: { $ref: '#/components/requestBodies/Register' }
      responses:
        '201': { $ref: '#/components/responses/SessionEstablished' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Create a parent account session
      description: |
        Authenticates with a normalized email address and enters Parent Mode
        immediately. Unknown email addresses and incorrect passwords return the same
        response. A successful login rotates the opaque session and CSRF credentials.
      security: []
      x-rate-limit-policy: login-identity-and-source
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses:
        '200': { $ref: '#/components/responses/SessionEstablished' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current account session
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '204':
          description: Session revoked and browser credential expired
          headers:
            Set-Cookie:
              description: Expires the habit_home_session cookie immediately.
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/session:
    get:
      tags: [Authentication]
      summary: Get the current actor and privilege state
      responses:
        '200': { $ref: '#/components/responses/SessionOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/session/parent/unlock:
    post:
      tags: [Authentication]
      summary: Enter or refresh Parent Mode
      x-rate-limit-policy: parent-unlock-session
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParentUnlockInput' }
      responses:
        '200': { $ref: '#/components/responses/SessionOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/session/parent/lock:
    post:
      tags: [Authentication]
      summary: Leave Parent Mode immediately
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '200': { $ref: '#/components/responses/SessionOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/session/child:
    post:
      tags: [Authentication]
      summary: Enter a child-scoped session and lock Parent Mode
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnterChildInput' }
      responses:
        '200': { $ref: '#/components/responses/SessionOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Authentication]
      summary: Leave the child profile for the profile picker
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '200': { $ref: '#/components/responses/SessionOK' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/household:
    get:
      tags: [Household]
      summary: Read household settings
      x-required-role: parent
      responses:
        '200':
          description: Household
          content: { application/json: { schema: { $ref: '#/components/schemas/HouseholdResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Household]
      summary: Update household settings
      x-required-role: parent
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HouseholdUpdateInput' } } }
      responses:
        '200':
          description: Updated household
          content: { application/json: { schema: { $ref: '#/components/schemas/HouseholdResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/profiles:
    get:
      tags: [Children]
      summary: List active profile-picker projections
      description: Available in any authenticated mode and deliberately excludes parent-only metadata.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Active profiles page
          content: { application/json: { schema: { $ref: '#/components/schemas/ProfilesResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/children:
    get:
      tags: [Children]
      summary: List children for management
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Children page
          content: { application/json: { schema: { $ref: '#/components/schemas/ChildrenResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Children]
      summary: Create a child
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/RequiredIfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChildInput' } } }
      responses:
        '201': { description: Child created, content: { application/json: { schema: { $ref: '#/components/schemas/ChildResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/children/{childId}:
    parameters: [{ $ref: '#/components/parameters/ChildId' }]
    patch:
      tags: [Children]
      summary: Update a child
      x-required-role: parent
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChildUpdateInput' } } }
      responses:
        '200': { description: Updated child, content: { application/json: { schema: { $ref: '#/components/schemas/ChildResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Children]
      summary: Archive a child
      x-required-role: parent
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '204': { description: Child archived; history is retained }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/habits:
    get:
      tags: [Habits]
      summary: List household habit definitions
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Habits page, content: { application/json: { schema: { $ref: '#/components/schemas/HabitsResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Habits]
      summary: Create a recurring habit definition
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/RequiredIfMatch' }
      requestBody: { $ref: '#/components/requestBodies/Habit' }
      responses:
        '201': { description: Habit created, content: { application/json: { schema: { $ref: '#/components/schemas/HabitResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/habits/{habitId}:
    parameters: [{ $ref: '#/components/parameters/HabitId' }]
    patch:
      tags: [Habits]
      summary: Update habit presentation for an effective date
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/OptionalIdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HabitUpdateInput' } } }
      responses:
        '200': { description: Updated habit, content: { application/json: { schema: { $ref: '#/components/schemas/HabitResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Habits]
      summary: Deactivate a habit and future unstarted occurrences
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/OptionalIdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { name: effectiveDate, in: query, required: true, schema: { $ref: '#/components/schemas/LocalDate' } }
      responses:
        '204': { description: Habit deactivated; history retained }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/habits/{habitId}/assignments:
    parameters: [{ $ref: '#/components/parameters/HabitId' }]
    post:
      tags: [Assignments]
      summary: Atomically assign a habit and schedule to one or more children
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/RequiredIfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentInput' } } }
      responses:
        '201': { description: Assignments created, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentsResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/assignments/{assignmentId}:
    parameters: [{ $ref: '#/components/parameters/AssignmentId' }]
    patch:
      tags: [Assignments]
      summary: Replace an assignment schedule from an effective date
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/OptionalIdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentUpdateInput' } } }
      responses:
        '200': { description: Updated assignment, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Assignments]
      summary: Deactivate an assignment from an effective date
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/OptionalIdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
        - { name: effectiveDate, in: query, required: true, schema: { $ref: '#/components/schemas/LocalDate' } }
      responses:
        '204': { description: Assignment deactivated; decided occurrences retained }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/tasks:
    get:
      tags: [Tasks]
      summary: List household one-off tasks
      x-required-role: parent
      parameters:
        - { name: childId, in: query, schema: { $ref: '#/components/schemas/UUID' } }
        - { name: status, in: query, schema: { type: string, enum: [active, cancelled] } }
      responses:
        '200': { description: Tasks page, content: { application/json: { schema: { $ref: '#/components/schemas/TasksResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Tasks]
      summary: Create a one-off task
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaskInput' } } }
      responses:
        '201': { description: Task created, content: { application/json: { schema: { $ref: '#/components/schemas/TaskResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tasks/{taskId}:
    parameters: [{ $ref: '#/components/parameters/TaskId' }]
    patch:
      tags: [Tasks]
      summary: Update an undecided one-off task
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/OptionalIdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaskUpdateInput' } } }
      responses:
        '200': { description: Task updated, content: { application/json: { schema: { $ref: '#/components/schemas/TaskResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Tasks]
      summary: Cancel an undecided task
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/OptionalIdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonInput' } } }
      responses:
        '204': { description: Task cancelled; history retained }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/children/{childId}/today:
    parameters:
      - { $ref: '#/components/parameters/ChildId' }
      - { name: date, in: query, required: false, description: Defaults to today in the household timezone., schema: { $ref: '#/components/schemas/LocalDate' } }
    get:
      tags: [Today]
      summary: Get a child's dated occurrences and actionable overdue tasks
      description: Parent may read any household child and request an explicit date. A child session may read only its own childId and household-local current date; another date returns date_not_allowed. Same-day tasks are included, while sibling, cross-household, and nonexistent child identifiers are uniformly hidden with 404.
      x-required-role: parent
      responses:
        '200': { description: Today view, content: { application/json: { schema: { $ref: '#/components/schemas/TodayResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/occurrences/{occurrenceId}/completions:
    parameters: [{ $ref: '#/components/parameters/OccurrenceId' }]
    post:
      tags: [Completions]
      summary: Submit completion as the assigned child
      x-required-role: same-child
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/RequiredIfMatch' }
      responses:
        '201': { description: Completion pending approval, content: { application/json: { schema: { $ref: '#/components/schemas/CompletionResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/completions/{completionId}:
    parameters: [{ $ref: '#/components/parameters/CompletionId' }]
    delete:
      tags: [Completions]
      summary: Withdraw a pending completion as the assigned child
      x-required-role: same-child
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/RequiredIfMatch' }
      responses:
        '200': { description: Withdrawn completion, content: { application/json: { schema: { $ref: '#/components/schemas/CompletionResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/review/pending:
    get:
      tags: [Review]
      summary: List pending completions
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: childId, in: query, schema: { $ref: '#/components/schemas/UUID' } }
      responses:
        '200': { description: Pending review page, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewItemsResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/completions/{completionId}/approve:
    parameters: [{ $ref: '#/components/parameters/CompletionId' }]
    post:
      tags: [Review]
      summary: Approve completion and award points atomically
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/RequiredIfMatch' }
      responses:
        '200': { description: Approved completion, content: { application/json: { schema: { $ref: '#/components/schemas/CompletionResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/completions/{completionId}/reject:
    parameters: [{ $ref: '#/components/parameters/CompletionId' }]
    post:
      tags: [Review]
      summary: Reject a pending completion
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/RequiredIfMatch' }
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/RejectionInput' } } }
      responses:
        '200': { description: Rejected completion, content: { application/json: { schema: { $ref: '#/components/schemas/CompletionResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/completions/{completionId}/reverse:
    parameters: [{ $ref: '#/components/parameters/CompletionId' }]
    post:
      tags: [Review]
      summary: Reverse an approval with an immutable compensating ledger entry
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/RequiredIfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonInput' } } }
      responses:
        '200': { description: Reversed terminal completion, content: { application/json: { schema: { $ref: '#/components/schemas/CompletionResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/children/{childId}/points:
    parameters: [{ $ref: '#/components/parameters/ChildId' }]
    get:
      tags: [Points]
      summary: Get a child's current balance
      x-required-role: parent-or-same-child
      responses:
        '200': { description: Balance, content: { application/json: { schema: { $ref: '#/components/schemas/BalanceResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/children/{childId}/points/ledger:
    parameters: [{ $ref: '#/components/parameters/ChildId' }]
    get:
      tags: [Points]
      summary: List immutable point entries
      x-required-role: parent-or-same-child
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Point ledger page, content: { application/json: { schema: { $ref: '#/components/schemas/LedgerResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/children/{childId}/points/corrections:
    parameters: [{ $ref: '#/components/parameters/ChildId' }]
    post:
      tags: [Points]
      summary: Add an audited positive parent correction
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CorrectionInput' } } }
      responses:
        '201': { description: Correction entry, content: { application/json: { schema: { $ref: '#/components/schemas/LedgerEntryResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/children/{childId}/occurrences:
    parameters: [{ $ref: '#/components/parameters/ChildId' }]
    get:
      tags: [Points]
      summary: List occurrence history
      x-required-role: parent
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: from, in: query, schema: { $ref: '#/components/schemas/LocalDate' } }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/LocalDate' } }
      responses:
        '200': { description: Occurrence history page, content: { application/json: { schema: { $ref: '#/components/schemas/OccurrencesResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/reports/children/{childId}:
    parameters: [{ $ref: '#/components/parameters/ChildId' }]
    get:
      tags: [Reports]
      summary: Get per-child daily, weekly, or monthly progress
      x-required-role: parent
      parameters:
        - { name: period, in: query, required: true, schema: { type: string, enum: [day, week, month] } }
        - { name: anchorDate, in: query, required: true, description: Household-local date within the requested period., schema: { $ref: '#/components/schemas/LocalDate' } }
      responses:
        '200': { description: Aggregate report with explicit local boundaries, content: { application/json: { schema: { $ref: '#/components/schemas/ReportResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /health/live:
    get:
      tags: [Operations]
      summary: Process liveness
      security: []
      responses:
        '200': { description: Process is alive, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /health/ready:
    get:
      tags: [Operations]
      summary: Dependency readiness
      security: []
      responses:
        '200': { description: Dependencies are ready, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '503': { description: A required dependency is unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: habit_home_session
      description: Secure, HttpOnly, SameSite=Lax account/session credential.
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit or session-bound CSRF token returned with session bootstrap data.
      schema: { type: string, minLength: 16 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated opaque key. The server replays the first result for the same actor, operation, key, and request body.
      schema: { type: string, minLength: 1, maxLength: 128 }
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: When supplied, exact retries replay the first successful response; reuse with different input returns 409.
      schema: { type: string, minLength: 1, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Positive resource version. A stale version returns 409 version_conflict.
      schema: { type: string, pattern: '^(W/)?"?[1-9][0-9]*"?$' }
    RequiredIfMatch:
      name: If-Match
      in: header
      required: true
      description: Current positive occurrence version. A stale version returns 409 version_conflict.
      schema: { type: string, pattern: '^(W/)?"?[1-9][0-9]*"?$' }
    Cursor: { name: cursor, in: query, schema: { type: string }, description: Opaque cursor from page.nextCursor. }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    ChildId: { name: childId, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    HabitId: { name: habitId, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    AssignmentId: { name: assignmentId, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    TaskId: { name: taskId, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    OccurrenceId: { name: occurrenceId, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    CompletionId: { name: completionId, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
  requestBodies:
    Register:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/RegisterInput' } } }
    Login:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/LoginInput' } } }
    Habit:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/HabitInput' } } }
  responses:
    SessionEstablished:
      description: Authenticated with a fresh session in Parent Mode
      headers:
        Set-Cookie:
          description: |
            Sets the opaque habit_home_session credential with HttpOnly, SameSite=Lax,
            Path=/, and Max-Age no longer than 30 days; Secure is mandatory outside
            explicit local HTTP development.
          schema: { type: string }
      content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } }
    SessionOK:
      description: Current session
      content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } }
    Error:
      description: Error response
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ValidationError:
      description: One or more input fields are invalid
      content: { application/json: { schema: { $ref: '#/components/schemas/ValidationErrorResponse' } } }
    Unauthorized: { description: Authentication is missing or invalid, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Actor lacks permission, Parent Mode is locked, or the CSRF token is missing or invalid. CSRF failures use error code csrf_invalid., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Resource does not exist within the actor's household scope, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: State transition, uniqueness, or idempotency conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    RateLimited:
      description: |
        Too many authentication attempts. Login uses both normalized-email/source
        and source-wide buckets; registration uses a source-wide bucket; Parent Mode
        unlock uses the authenticated session/user bucket. Responses do not reveal
        whether an account exists. Limits use a rolling window, count failures, and
        may also count abusive successful traffic. Retry-After reports the remaining
        delay in seconds.
      headers:
        Retry-After:
          description: Seconds until this request may be retried.
          schema: { type: integer, minimum: 1 }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    ParentOverview:
      type: object
      required: [date, timezone, pending, children]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        timezone: { type: string }
        pending: { type: integer, minimum: 0 }
        children:
          type: array
          items:
            type: object
            required: [childId, nickname, avatar, color, completed, total, pending]
            properties:
              childId: { $ref: '#/components/schemas/UUID' }
              nickname: { type: string }
              avatar: { type: string }
              color: { type: string }
              completed: { type: integer, minimum: 0 }
              total: { type: integer, minimum: 0 }
              pending: { type: integer, minimum: 0 }
    UUID: { type: string, format: uuid }
    Timestamp: { type: string, format: date-time, description: UTC RFC 3339 timestamp. }
    LocalDate: { type: string, format: date, description: Calendar date in the household IANA timezone. }
    Points: { type: integer, minimum: 1, maximum: 10000, default: 5 }
    Page:
      type: object
      required: [hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [unauthorized] }
            message: { type: string }
            requestId: { type: string }
    ValidationErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, validation]
          properties:
            code: { type: string, const: validation_failed }
            message: { type: string }
            requestId: { type: string }
            validation:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/ValidationIssue' }
    ValidationIssue:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, description: JSON field path. }
        code: { type: string, examples: [required] }
        message: { type: string }
    RegisterInput:
      type: object
      required: [email, password, householdName, timezone, weekStartsOn]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 12, maxLength: 128 }
        householdName: { type: string, minLength: 1, maxLength: 80 }
        timezone: { type: string, examples: [Asia/Jakarta], description: IANA timezone name. }
        weekStartsOn: { type: string, enum: [sunday, monday], default: sunday }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    ParentUnlockInput:
      oneOf:
        - type: object
          required: [password]
          properties: { password: { type: string, format: password } }
          additionalProperties: false
        - type: object
          required: [pin]
          properties: { pin: { type: string, pattern: '^\\d{6}$' } }
          additionalProperties: false
    EnterChildInput:
      type: object
      required: [childId]
      properties:
        childId: { $ref: '#/components/schemas/UUID' }
        pin: { type: string, pattern: '^\\d{4,6}$' }
    Session:
      type: object
      required: [actor, parentMode, csrfToken, idleExpiresAt, absoluteExpiresAt]
      properties:
        actor: { type: string, enum: [profile_picker, parent, child] }
        userId: { oneOf: [{ $ref: '#/components/schemas/UUID' }, { type: 'null' }] }
        householdId: { $ref: '#/components/schemas/UUID' }
        childId: { oneOf: [{ $ref: '#/components/schemas/UUID' }, { type: 'null' }] }
        parentMode: { type: boolean }
        csrfToken: { type: string, writeOnly: true }
        idleExpiresAt:
          description: Parent Mode idle deadline; null while Parent Mode is not active.
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
        absoluteExpiresAt: { $ref: '#/components/schemas/Timestamp' }
    SessionResponse:
      type: object
      required: [data]
      properties: { data: { $ref: '#/components/schemas/Session' } }
    Household:
      type: object
      required: [id, name, timezone, weekStartsOn, parentModeTimeoutMinutes]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        timezone: { type: string, examples: [Asia/Jakarta] }
        weekStartsOn: { type: string, enum: [sunday, monday] }
        parentModeTimeoutMinutes: { type: integer, enum: [5, 15, 30] }
    HouseholdUpdateInput:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        timezone: { type: string }
        weekStartsOn: { type: string, enum: [sunday, monday] }
        parentModeTimeoutMinutes: { type: integer, enum: [5, 15, 30] }
        parentPin: { type: [string, 'null'], pattern: '^\\d{6}$', description: Null removes the PIN. }
    HouseholdResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Household' } } }
    ChildInput:
      type: object
      required: [nickname, avatar, color]
      properties:
        nickname: { type: string, minLength: 1, maxLength: 40 }
        avatar: { type: string, enum: [fox, bear, rabbit, owl, cat, elephant, panda, koala] }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        pin: { type: string, pattern: '^\\d{4,6}$' }
    ChildUpdateInput:
      type: object
      minProperties: 1
      description: Omit pin to preserve it and send null to remove it.
      properties:
        nickname: { type: string, minLength: 1, maxLength: 40 }
        avatar: { type: string, enum: [fox, bear, rabbit, owl, cat, elephant, panda, koala] }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        pin:
          oneOf:
            - { type: string, pattern: '^\\d{4,6}$' }
            - { type: 'null' }
    Child:
      allOf:
        - { $ref: '#/components/schemas/ChildInput' }
        - type: object
          required: [id, active, pinEnabled, createdAt, updatedAt]
          properties:
            id: { $ref: '#/components/schemas/UUID' }
            pin: false
            pinEnabled: { type: boolean }
            active: { type: boolean }
            createdAt: { $ref: '#/components/schemas/Timestamp' }
            updatedAt: { $ref: '#/components/schemas/Timestamp' }
            assignments: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
    ChildResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Child' } } }
    ChildrenResponse:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Child' } }
        page: { $ref: '#/components/schemas/Page' }
    Profile:
      type: object
      required: [id, nickname, avatar, color, pinRequired]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        nickname: { type: string }
        avatar: { type: string, enum: [fox, bear, rabbit, owl, cat, elephant, panda, koala] }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        pinRequired: { type: boolean }
    ProfilesResponse:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Profile' } }
        page: { $ref: '#/components/schemas/Page' }
    HabitInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        icon: { type: string, maxLength: 40 }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
    HabitUpdateInput:
      type: object
      required: [effectiveDate]
      properties:
        effectiveDate: { $ref: '#/components/schemas/LocalDate' }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        icon: { type: string, maxLength: 40 }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
    Habit:
      allOf:
        - { $ref: '#/components/schemas/HabitInput' }
        - type: object
          required: [id, active, version, createdAt, updatedAt]
          properties:
            id: { $ref: '#/components/schemas/UUID' }
            active: { type: boolean }
            version: { type: integer, format: int64, minimum: 1 }
            createdAt: { $ref: '#/components/schemas/Timestamp' }
            updatedAt: { $ref: '#/components/schemas/Timestamp' }
    HabitResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Habit' } } }
    HabitsResponse: { type: object, required: [data, page], properties: { data: { type: array, items: { $ref: '#/components/schemas/Habit' } }, page: { $ref: '#/components/schemas/Page' } } }
    Schedule:
      oneOf:
        - type: object
          required: [kind]
          properties: { kind: { type: string, const: daily } }
          additionalProperties: false
        - type: object
          required: [kind, weekdays]
          properties:
            kind: { type: string, const: weekdays }
            weekdays: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday] } }
          additionalProperties: false
    AssignmentInput:
      type: object
      required: [childIds, points, schedule, effectiveStartDate]
      properties:
        childIds: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/UUID' } }
        points: { $ref: '#/components/schemas/Points' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        effectiveStartDate: { $ref: '#/components/schemas/LocalDate' }
    AssignmentUpdateInput:
      type: object
      required: [effectiveDate]
      properties:
        effectiveDate: { $ref: '#/components/schemas/LocalDate' }
        points: { $ref: '#/components/schemas/Points' }
        schedule: { $ref: '#/components/schemas/Schedule' }
    Assignment:
      type: object
      required: [id, habitId, childId, points, schedule, effectiveStartDate, active, version]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        habitId: { $ref: '#/components/schemas/UUID' }
        childId: { $ref: '#/components/schemas/UUID' }
        points: { $ref: '#/components/schemas/Points' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        effectiveStartDate: { $ref: '#/components/schemas/LocalDate' }
        active: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
    AssignmentResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Assignment' } } }
    AssignmentsResponse: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/Assignment' } } } }
    TaskInput:
      type: object
      required: [childId, title, dueDate, points]
      properties:
        childId: { $ref: '#/components/schemas/UUID' }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        dueDate: { $ref: '#/components/schemas/LocalDate' }
        points: { $ref: '#/components/schemas/Points' }
    TaskUpdateInput:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        dueDate: { $ref: '#/components/schemas/LocalDate' }
        points: { $ref: '#/components/schemas/Points' }
    Task:
      allOf:
        - { $ref: '#/components/schemas/TaskInput' }
        - type: object
          required: [id, status, version, createdAt]
          properties:
            id: { $ref: '#/components/schemas/UUID' }
            status: { type: string, enum: [active, cancelled] }
            version: { type: integer, format: int64, minimum: 1 }
            createdAt: { $ref: '#/components/schemas/Timestamp' }
    TaskResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Task' } } }
    TasksResponse: { type: object, required: [data, page], properties: { data: { type: array, items: { $ref: '#/components/schemas/Task' } }, page: { $ref: '#/components/schemas/Page' } } }
    Occurrence:
      type: object
      required: [id, childId, type, localDate, dueDate, title, description, icon, color, points, status, group, dueState, version, completionId, availableActions]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        childId: { $ref: '#/components/schemas/UUID' }
        type: { type: string, enum: [habit, task] }
        localDate: { $ref: '#/components/schemas/LocalDate' }
        dueDate: { oneOf: [{ $ref: '#/components/schemas/LocalDate' }, { type: 'null' }] }
        title: { type: string, description: Immutable occurrence snapshot. }
        description: { type: string, description: Immutable occurrence snapshot. }
        icon: { type: string, description: Immutable occurrence snapshot. }
        color: { type: string, description: Immutable occurrence snapshot. }
        points: { $ref: '#/components/schemas/Points' }
        status: { type: string, enum: [not_started, pending_approval, approved, approval_reversed, cancelled] }
        group: { type: string, enum: [to_do, waiting_for_parent, done] }
        dueState: { type: string, enum: [scheduled_today, overdue, historical] }
        version: { type: integer, format: int64, minimum: 1 }
        completionId: { oneOf: [{ $ref: '#/components/schemas/UUID' }, { type: 'null' }] }
        availableActions: { type: array, items: { type: string, enum: [submit, withdraw] }, maxItems: 1 }
    Today:
      type: object
      required: [childId, date, timezone, counts, occurrences]
      properties:
        childId: { $ref: '#/components/schemas/UUID' }
        date: { $ref: '#/components/schemas/LocalDate' }
        timezone: { type: string }
        counts:
          type: object
          required: [to_do, waiting_for_parent, done]
          properties:
            to_do: { type: integer, minimum: 0 }
            waiting_for_parent: { type: integer, minimum: 0 }
            done: { type: integer, minimum: 0 }
        occurrences: { type: array, items: { $ref: '#/components/schemas/Occurrence' } }
    TodayResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Today' } } }
    Completion:
      type: object
      required: [id, occurrenceId, childId, attemptStatus, occurrenceStatus, occurrenceVersion, submittedAt]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        occurrenceId: { $ref: '#/components/schemas/UUID' }
        childId: { $ref: '#/components/schemas/UUID' }
        attemptStatus: { type: string, enum: [pending, withdrawn, approved, rejected, cancelled] }
        occurrenceStatus: { type: string, enum: [not_started, pending_approval, approved, approval_reversed, cancelled] }
        occurrenceVersion: { type: integer, format: int64, minimum: 1 }
        submittedAt: { $ref: '#/components/schemas/Timestamp' }
        decidedAt: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        reason: { type: [string, 'null'] }
        ledgerEntryId: { oneOf: [{ $ref: '#/components/schemas/UUID' }, { type: 'null' }], description: Ledger row created by approval or reversal. }
        ledgerAmount: { type: integer, description: Signed ledger delta; zero when no ledger row was created. }
    CompletionResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Completion' } } }
    CompletionsResponse: { type: object, required: [data, page], properties: { data: { type: array, items: { $ref: '#/components/schemas/Completion' } }, page: { $ref: '#/components/schemas/Page' } } }
    ReviewItem:
      allOf:
        - { $ref: '#/components/schemas/Completion' }
        - type: object
          required: [childName, childAvatar, childColor, title, type, localDate, dueDate, points, attemptNumber, availableActions]
          properties:
            childName: { type: string }
            childAvatar: { type: string }
            childColor: { type: string }
            title: { type: string }
            type: { type: string, enum: [habit, task] }
            localDate: { $ref: '#/components/schemas/LocalDate' }
            dueDate: { oneOf: [{ $ref: '#/components/schemas/LocalDate' }, { type: 'null' }] }
            points: { $ref: '#/components/schemas/Points' }
            attemptNumber: { type: integer, minimum: 1 }
            availableActions: { type: array, items: { type: string, enum: [approve, reject] } }
    ReviewItemsResponse: { type: object, required: [data, page], properties: { data: { type: array, items: { $ref: '#/components/schemas/ReviewItem' } }, page: { $ref: '#/components/schemas/Page' } } }
    RejectionInput: { type: object, properties: { reason: { type: string, maxLength: 500 } } }
    ReasonInput: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 500 } } }
    Balance: { type: object, required: [childId, points, asOf], properties: { childId: { $ref: '#/components/schemas/UUID' }, points: { type: integer }, asOf: { $ref: '#/components/schemas/Timestamp' } } }
    BalanceResponse: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Balance' } } }
    LedgerEntry:
      type: object
      required: [id, childId, kind, amount, displayLabel, createdAt]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        childId: { $ref: '#/components/schemas/UUID' }
        kind: { type: string, enum: [award, approval_reversal, manual_correction] }
        amount: { type: integer, description: Signed ledger delta. }
        displayLabel: { type: string, description: Neutral child-safe activity label. }
        reason: { type: [string, 'null'], description: Parent-only administrative reason; null in child projections. }
        occurrenceId: { oneOf: [{ $ref: '#/components/schemas/UUID' }, { type: 'null' }] }
